<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Śpiewnik Pielgrzyma</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#4a2f1f" />

<!-- iOS-specific -->
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Śpiewnik" />

</head>
<body>

  <!-- MAIN SCREEN: song list -->
  <div id="list-screen" class="screen active">
    <header class="app-header">
      <h1>Śpiewnik Pielgrzyma</h1>
    </header>

    <div class="search-area">
      <input
        type="text"
        id="search-input"
        placeholder="Szukaj piosenki..."
        autocomplete="off"
      />
      <div class="page-jump">
        <input
            type="number"
            id="page-input"
            placeholder="Nr strony"
            inputmode="numeric"
            min="1"
        />
        <button id="page-go-btn">Idź</button>
      </div>
    </div>

    <ul id="song-list" class="song-list"></ul>
  </div>

  <!-- READING SCREEN: single song (built in the next step) -->
  <div id="song-screen" class="screen">
  <header class="app-header song-header">
    <button id="back-btn" aria-label="Wróć">&larr;</button>
    <h1 id="song-title"></h1>
    <div class="font-controls">
      <button id="font-smaller-btn" aria-label="Mniejszy tekst">A−</button>
      <button id="font-bigger-btn" aria-label="Większy tekst">A+</button>
    </div>
  </header>
  <div id="song-lyrics" class="song-lyrics"></div>
</div>

  <script src="songs/songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
