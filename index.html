<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Śpiewnik Pielgrzyma</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- MAIN SCREEN: song list -->
  <div id="list-screen" class="screen active">
    <header class="app-header">
      <h1>Śpiewnik Pielgrzyma</h1>
    </header>

    <div class="search-area">
      <input
        type="text"
        id="search-input"
        placeholder="Szukaj piosenki..."
        autocomplete="off"
      />
      <div class="page-jump">
        <input
          type="number"
          id="page-input"
          placeholder="Nr strony"
          inputmode="numeric"
        />
        <button id="page-go-btn">Idź</button>
      </div>
    </div>

    <ul id="song-list" class="song-list"></ul>
  </div>

  <!-- READING SCREEN: single song (built in the next step) -->
  <div id="song-screen" class="screen">
  <header class="app-header song-header">
    <button id="back-btn" aria-label="Wróć">&larr;</button>
    <h1 id="song-title"></h1>
    <div class="font-controls">
      <button id="font-smaller-btn" aria-label="Mniejszy tekst">A−</button>
      <button id="font-bigger-btn" aria-label="Większy tekst">A+</button>
    </div>
  </header>
  <div id="song-lyrics" class="song-lyrics"></div>
</div>

  <script src="songs/songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
